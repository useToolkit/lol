name: Build Wantview APK

on:
  push:
    branches: [ "wantview-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btc-floating-overlay-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wantview-v2-debug
          path: btc-floating-overlay-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
