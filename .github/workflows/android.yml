name: Build I photo APK

on:
  push:
    branches: [ 'i-photo' ]
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout I photo
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk I-photo-v1.3.0.apk
      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: I-photo-APK
          path: I-photo-v1.3.0.apk
          retention-days: 90
      - name: Publish direct-download branch
        if: github.ref == 'refs/heads/i-photo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/iphoto-publish
          cp I-photo-v1.3.0.apk /tmp/iphoto-publish/
          cd /tmp/iphoto-publish
          git init -q
          git checkout -qb i-photo-apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add I-photo-v1.3.0.apk
          git commit -qm 'Publish latest I photo debug APK'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin i-photo-apk
